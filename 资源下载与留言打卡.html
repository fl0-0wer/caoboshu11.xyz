    <script>
        // 标签页切换功能
        function openTab(evt, tabName) {
            // 隐藏所有内容
            var tabcontent = document.getElementsByClassName("tab-content");
            for (var i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            
            // 移除所有按钮的active类
            var tablinks = document.getElementsByClassName("tab-btn");
            for (var i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            
            // 显示当前标签页内容并激活按钮
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
        
        // 评论相关功能
        // 声明一个空的全局数组，准备接收数据库发来的数据
        let comments = []; 
        
        // 管理员暗号存储在本地浏览器里
function adminLogin() {
    const key = prompt("请输入管理员暗号：");
    if (key) {
        localStorage.setItem('admin_token', key);
        loadComments();
    }
}
        // 【新增功能】：向服务器索要留言数据
        function loadComments() {
    const token = localStorage.getItem('admin_token') || '';
    // 把暗号带给后端
    fetch(`backend_api.php?action=get&token=${token}`)
        .then(response => response.json())
        .then(data => {
            comments = data;
            renderComments();
        });
}

        function addComment() {
            const nameInput = document.getElementById('name');
            const contentInput = document.getElementById('content');
            
            if (nameInput.value.trim() === '' || contentInput.value.trim() === '') {
                alert('请填写完整信息！');
                return;
            }
            
            // 将表单数据打包
            const formData = new FormData();
            formData.append('name', nameInput.value.trim());
            formData.append('content', contentInput.value.trim());
            
            // 发送给后端的 'add' 接口
            fetch('backend_api.php?action=add', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('发布留言成功！');
                    nameInput.value = '';
                    contentInput.value = '';
                    // 留言成功后，重新从数据库拉取最新数据刷新页面
                    loadComments(); 
                } else {
                    // 如果被 IP 限制，这里会弹出后端设定的报错信息
                    alert(data.message); 
                }
            })
            .catch(error => {
                alert('网络连接错误，请稍后再试。');
            });
        }
        
        function sortComments() {
            const sortOrder = document.getElementById('sortOrder').value;
            
            comments.sort((a, b) => {
                // 第一优先级：提取置顶状态（强制转为数字，防范 undefined 或字符串 "1"）
                const topA = Number(a.is_top) || 0;
                const topB = Number(b.is_top) || 0;
                
                // 如果一个置顶一个没置顶，置顶的排前面
                if (topA !== topB) {
                    return topB - topA; // 因为 1 - 0 = 1，会让 B 往后排；0 - 1 = -1，会让 A 往后排
                }
                
                // 第二优先级：如果置顶状态相同，则走正常的日期比对算法
                const timeA = new Date(a.time).getTime();
                const timeB = new Date(b.time).getTime();
                
                if (sortOrder === 'newest') {
                    return timeB - timeA; // 最新发出的排在前面（降序）
                } else {
                    return timeA - timeB; // 最早发出的排在前面（升序）
                }
            });
            
            // 重新洗牌完成后，交给渲染器渲染
            renderComments();
        }
        
        function renderComments() {
            const container = document.getElementById('commentsContainer');
            if (!container) return;
            container.innerHTML = '';

            if (comments.length === 0) {
                container.innerHTML = '<div style="padding:20px; text-align:center; color:#999;">暂时没有留言，快来抢沙发！</div>';
                return;
            }

            comments.forEach(comment => {
                const commentElement = document.createElement('div');
                commentElement.className = 'comment-item';
                
                // --- 仅改变背景色，不再在名字前面加任何东西 ---
                if (comment.is_top == 1) {
                    commentElement.classList.add('pinned'); 
                }

                // --- 组装右下角的控制区与状态区 ---
                let bottomControls = '';
                
                // 1. 本人或管理员可见的 [删除]
                if (comment.can_manage) {
                    bottomControls += `<button onclick="deleteMsg(${comment.id})" style="color:#ff4d4f; cursor:pointer; border:none; background:none; font-size:12px;">[删除]</button>`;
                }

                // 2. 所有人可见的静态 [置顶] 标志，紧跟在删除右边 (如果这条评论被置顶了)
                if (comment.is_top == 1) {
                    bottomControls += `<span style="color:#1890ff; font-weight:bold; font-size:12px; margin-left:10px;">[置顶]</span>`;
                }

                // 3. 管理员专属的操作按钮 (紧跟在最后面)
                if (comment.is_admin) {
                    const actionText = comment.is_top == 1 ? '[取消置顶]' : '[设为置顶]';
                    bottomControls += `<button onclick="toggleTop(${comment.id})" style="color:#1890ff; cursor:pointer; margin-left:10px; border:none; background:none; font-size:12px;">${actionText}</button>`;
                }

                // 渲染 HTML，注意看顶部的名字区域已经非常干净了
                commentElement.innerHTML = `
                    <div class="comment-header">
                        <span class="comment-name">
                            <strong>${comment.name}</strong>
                        </span>
                        <span class="comment-time" style="color:#999; font-size:12px;">${comment.time}</span>
                    </div>
                    <div class="comment-content" style="margin-top:10px; line-height:1.6; word-break:break-all;">
                        ${comment.content}
                    </div>
                    <div style="text-align:right; margin-top:8px;">
                        ${bottomControls}
                    </div>
                `;
                container.appendChild(commentElement);
            });
        }
        
        // 页面打开时，不再直接 render，而是去服务器拉取数据
        loadComments();
        function deleteMsg(id) {
    if(!confirm("确定要删除这条留言吗？")) return;
    const token = localStorage.getItem('admin_token') || '';
    const formData = new FormData();
    formData.append('id', id);
    formData.append('token', token);

    fetch('backend_api.php?action=delete', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => { if(data.success) loadComments(); });
}

function toggleTop(id) {
    const token = localStorage.getItem('admin_token') || '';
    const formData = new FormData();
    formData.append('id', id);
    formData.append('token', token);

    fetch('backend_api.php?action=toggle_top', { 
        method: 'POST', 
        body: formData 
    })
    .then(res => res.json())
    .then(data => { 
        if(data.success) {
            // 找到刚才操作的那条评论，判断它是变成了置顶还是取消了
            const comment = comments.find(c => c.id == id);
            const statusText = comment.is_top == 1 ? "取消置顶" : "置顶";
            alert("✅ " + statusText + "成功！");
            loadComments(); // 重新刷新列表
        } else {
            alert("❌ 操作失败：" + (data.message || "权限不足"));
        }
    })
    .catch(error => {
        alert("❌ 网络错误，操作无法完成。");
    });
}
// --- 管理员暗号登录逻辑 ---
let clickCount = 0;
let clickTimer = null;

// 监听页脚点击
document.getElementById('adminTrigger').addEventListener('click', function() {
    clickCount++;
    
    // 如果是第一次点击，开启一个 3 秒的计时器
    if (clickCount === 1) {
        clickTimer = setTimeout(() => {
            clickCount = 0; // 3 秒到了没点够，计数重置
        }, 3000);
    }

    // 达成 5 连击成就
    if (clickCount === 3) {
        clearTimeout(clickTimer); // 清除计时器
        clickCount = 0;           // 计数归零
        adminLogin();             // 召唤输入框
    }
});

function adminLogin() {
    const key = prompt("【身份验证】请输入管理员暗号：");
    if (key === null) return; // 用户点取消，啥也不干
    
    if (key.trim() !== "") {
        localStorage.setItem('admin_token', key);
        alert("身份切换成功，正在重新载入权限...");
        loadComments(); // 触发后端权限校验并刷新列表
    }
}
