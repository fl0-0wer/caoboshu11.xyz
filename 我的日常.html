<body><!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pop子与pipi美的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
		body{
			background-color: #FFCDCE;
			margin: 0;
		}
        /* 头部横幅 */
         .banner {
            width: 100%;
            height: 700px;
            position: relative; 
            overflow: hidden; 
        }
		 .banner img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
        /* 导航栏（修复结构） */
        .nav-ul {
            list-style: none;
            width: 100%;
            height: 70px;
            line-height: 40px;
            padding: 0 30px;
            background-color: #FFCE00;
			display:flex;
			justify-content: center;
			align-items: center;
        }
        .nav-ul li {
            float: left;
        }
        .nav-ul li a {
            display: block;
            color: #35448A;
            text-decoration: none;
            padding: 0 50px;
            text-align: center;
        }
        .nav-ul li a:hover {
            background-color: #35448A;
            color: #FFCE00;
            height: 50px;
        }
        /* 主体内容 */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            border-left: 6px solid #35448A;
            padding-left: 10px;
        }
        /* 介绍区域 */
        .intro img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        /* 图片展示区 */
        .pic-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 200px;
            gap: 15px;
        }
        .pic-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }
        /* 页脚 */
        .footer {
            width: 100%;
            height: 80px;
            background-color: #FFCE00;
            color: #35448A;
            text-align: center;
            line-height: 80px;
            font-size: 14px;
        }
                /* 手机端适配规则 */
/* 手机端适配规则 */
@media (max-width: 768px) {
    .banner { height: 300px; }
    
    .nav-ul {
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 5px 0;
        justify-content: center;
    }
    .nav-ul li {
        width: 50%;
        float: none;
    }
    .nav-ul li a {
        padding: 5px 10px;
        width: 100%;
        text-align: center;
        line-height: 1.2;
    }
    .nav-ul li a:hover {
        height: auto;
    }

    .container { width: 95%; }
    
    /* 图片展示区 - 一行两张带边距 */
    .pic-grid {
        grid-template-columns: repeat(2, 1fr) !important;  /* 一行两张 */
        grid-auto-rows: auto;
        gap: 10px;                                          /* 边距 */
    }
    .pic-grid img {
        width: 100%;
        height: auto;
        aspect-ratio: 1;                                    /* 保持正方形 */
    }
    
    .footer {
        width: 100%;
        height: 40px;
        line-height: 40px;
        font-size: 12px;
    }
}
    </style>
</head>
